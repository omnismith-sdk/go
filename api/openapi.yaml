        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/revokeOAuthToken_200_response"
          description: Token revoked successfully (or was already invalid)
        "400":
          description: Invalid revocation parameters
      summary: Revoke OAuth Token
      tags:
      - OAuth
