        explode: false
        in: path
        name: template_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "Attribute ID to sort by (UUID) OR one of: id, created_at, updated_at,\
          \ deleted_at"
        explode: true
        in: query
        name: sort_field
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: Sort direction (only used when sort_field is provided)
        explode: true
        in: query
        name: sort_direction
        required: false
        schema:
          default: asc
          enum:
          - asc
          - desc
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportEntitiesRequest"
        required: true
      responses:
        "200":
          content:
            text/csv:
              schema:
                format: binary
                type: string
          description: CSV file download
          headers:
            Content-Disposition:
              description: Attachment filename
              explode: false
              schema:
                example: attachment; filename="export_Template_2026-01-18_14-30-00.csv"
                type: string
              style: simple
        "401":
          description: Unauthorized
        "403":
          description: Access denied
        "404":
          description: Template not found
      security:
      - bearerAuth: []
      summary: Export entities to CSV
      tags:
      - Entity
