          description: JSON Web Key Set
      summary: Get JSON Web Key Set
      tags:
      - OAuth
  /.well-known/oauth-authorization-server:
    get:
      description: "Returns OAuth 2.0 Authorization Server Metadata (RFC 8414) defining\
