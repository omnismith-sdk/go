    CreateDashboardBlockRequest_config:
      description: "Widget configuration object containing data source, metrics, time\
        \ windows, and 12-column grid layout properties."
      example:
        template_id: 0190a1b2-c3d4-7e8f-9a0b-1c2d3e4f5a6b
        metric_attribute_id: 0190a1b2-c3d4-7e8f-9a0b-1c2d3e4f5a6d
        aggregate: avg
        bucket_width: 1 hour
        time_window: 86400
        entity_limit: 10
        x: 0
        "y": 0
        cols: 6
        rows: 3
      properties:
        template_id:
          description: UUID of the entity template serving as the data source (required
            for all block types).
          example: 0190a1b2-c3d4-7e8f-9a0b-1c2d3e4f5a6b
          format: uuid
          type: string
        metric_attribute_id:
          description: UUID of the metric attribute to aggregate/plot (required for
            chart and metric gauge blocks).
          example: 0190a1b2-c3d4-7e8f-9a0b-1c2d3e4f5a6d
          format: uuid
          nullable: true
          type: string
        time_window:
          default: 86400
          description: "Time range query window in seconds for historical telemetry.\
            \ CRITICAL for chart and time-series gauge blocks to query Entity Log\
            \ data points. Presets: 3600 (1 hour), 10800 (3 hours), 21600 (6 hours),\
            \ 43200 (12 hours), 86400 (24 hours / 1 day, recommended default), 604800\
            \ (7 days / 1 week), 2592000 (30 days / 1 month)."
          example: 86400
          nullable: true
          type: integer
        bucket_width:
          default: 1 hour
          description: "Time bucket interval for chart data aggregation. Standard\
            \ values: \"1 min\", \"5 min\", \"10 min\", \"15 min\", \"1 hour\" (default),\
            \ \"6 hours\", \"12 hours\", \"1 day\", \"1 week\", \"1 month\"."
          enum:
          - 1 sec
          - 5 sec
          - 10 sec
          - 1 min
          - 5 min
          - 10 min
          - 15 min
          - 30 min
          - 1 hour
          - 6 hours
          - 12 hours
          - 1 day
          - 1 week
          - 1 month
          example: 1 hour
          type: string
        aggregate:
          default: avg
          description: "Aggregation function for telemetry metric points: \"avg\"\
            \ (default for gauge/chart), \"sum\", \"min\", \"max\", \"first\", \"\
            last\", \"count\"."
          enum:
          - avg
          - sum
          - min
          - max
          - first
          - last
          - count
          example: avg
          type: string
        entity_limit:
          default: 10
          description: "Maximum number of entity series lines to plot concurrently\
            \ in chart blocks (1-50, default: 10)."
          example: 10
          type: integer
        min:
          default: 0
          description: "Minimum scale value for gauge blocks (default: 0)."
          example: 0
          type: number
        max:
          default: 100
          description: "Maximum scale value for gauge blocks (default: 100)."
          example: 100
          type: number
        unit:
          description: "Optional unit suffix for gauge blocks (e.g. \"%\", \"°C\"\
            , \"MB/s\", \"req/s\")."
          example: '%'
          nullable: true
          type: string
        start_color:
          description: Start gradient hex color for gauge blocks (e.g. "#3b82f6").
          example: "#3b82f6"
          nullable: true
          type: string
        mid_color:
          description: Middle gradient hex color for gauge blocks (optional).
          example: "#f59e0b"
          nullable: true
          type: string
        end_color:
          description: End gradient hex color for gauge blocks (e.g. "#06b6d4").
          example: "#06b6d4"
          nullable: true
          type: string
        limit:
          default: 10
          description: "Maximum number of rows to return for list table blocks (default:\
            \ 10)."
          example: 10
          type: integer
        sort:
          description: "Sort configuration object for list table blocks (e.g. {\"\
            created_at\": \"desc\"})."
          example:
            created_at: desc
          type: object
        visible_attributes:
          description: "Ordered list of attribute UUIDs (or \"created_at\", \"updated_at\"\
            ) to display as columns in list table blocks."
          example:
          - created_at
          - 0190a1b2-c3d4-7e8f-9a0b-1c2d3e4f5a6d
          items:
            type: string
          type: array
        filters:
          description: Optional entity filtering conditions applied to block data.
          items:
            $ref: "#/components/schemas/CreateDashboardBlockRequest_config_filters_inner"
          type: array
        x:
          default: 0
          description: Horizontal grid column position (0 to 11 on the 12-column grid
            canvas).
          example: 0
          maximum: 11
          minimum: 0
          type: integer
        "y":
          default: 0
          description: "Vertical grid row position (0 to N, 0-indexed)."
          example: 0
          minimum: 0
          type: integer
        cols:
          description: "Block width in columns on the 12-column grid canvas (1 to\
            \ 12). Guidelines: 12 = full-width (chart/list), 6 = half-width (chart/gauge,\
            \ 2 per row), 4 = one-third width (stat/gauge, 3 per row), 3 = one-fourth\
            \ width (stat, 4 per row). Sum of cols in a row should equal 12 for edge-to-edge\
            \ alignment."
          example: 6
          maximum: 12
          minimum: 1
          type: integer
        rows:
          description: "Block height in grid rows (1 to N). Guidelines: 2 = KPI stat\
            \ / radial gauge, 3-4 = time-series chart, 4-5 = list table."
          example: 3
          minimum: 1
          type: integer
      type: object
