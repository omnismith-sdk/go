openapi: 3.0.0
info:
  description: API Documentation for Omnismith
  title: Omnismith API
  version: 1.0.7
servers:
- description: Production Server
  url: https://api.omnismith.io/v1
- description: Local Development Server
  url: http://localhost:8100
tags:
- description: AccessTokens
  name: AccessTokens
- description: Attributes
  name: Attributes
- description: Auth
  name: Auth
- description: Automation - Automations
  name: Automation - Automations
- description: Automation - Notification Channels
  name: Automation - Notification Channels
- description: Automation - Push Devices
  name: Automation - Push Devices
- description: Billing
  name: Billing
- description: Dashboards
  name: Dashboards
- description: Dashboard Blocks
  name: Dashboard Blocks
- description: Schema
  name: Schema
- description: Entity
  name: Entity
- description: Feedback
  name: Feedback
- description: FileAttachment
  name: FileAttachment
- description: Marketplace
  name: Marketplace
- description: Projects
  name: Projects
- description: Roles
  name: Roles
- description: SavedQueries
  name: SavedQueries
- description: Templates
  name: Templates
- description: User
  name: User
paths:
  /access-tokens:
    get:
      description: Returns all access tokens for the current user and project.
      operationId: listAccessTokens
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listAccessTokens_200_response"
          description: Access tokens
        "401":
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: List API access tokens
      tags:
      - AccessTokens
    post:
      description: Creates a new API access token for the current user and project.
        The raw API key is returned once in the response and cannot be retrieved again.
      operationId: createAccessToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessTokenRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createAccessToken_201_response"
          description: Access token created
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Create an API access token
      tags:
      - AccessTokens
  /access-tokens/{id}:
    delete:
      operationId: deleteAccessToken
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      security:
      - bearerAuth: []
      summary: Delete an API access token
      tags:
      - AccessTokens
  /attributes/{id}/items:
    get:
      operationId: listAttributeItems
      parameters:
      - description: Attribute ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listAttributeItems_200_response"
          description: List of items
      security:
      - bearerAuth: []
      summary: List items of an attribute
      tags:
      - Attributes
    post:
      operationId: createAttributeItem
      parameters:
      - description: Attribute ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddListItemRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createAttributeItem_201_response"
          description: Item created
        "404":
          description: Attribute not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Add a list item to an attribute
      tags:
      - Attributes
    put:
      operationId: setAttributeItems
      parameters:
      - description: Attribute ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetListItemsRequest"
        required: true
      responses:
        "204":
          description: Items updated
        "400":
          description: Attribute is not a List type
        "404":
          description: Attribute not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Set list items for an attribute (replaces all existing items)
      tags:
      - Attributes
  /attributes:
    get:
      operationId: listAttributes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listAttributes_200_response"
          description: List of attributes
        "401":
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: List attributes
      tags:
      - Attributes
    post:
      operationId: createAttribute
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttributeRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createAttributeItem_201_response"
          description: Attribute created
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Tier quota exceeded
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Create a new attribute
      tags:
      - Attributes
  /attributes/{id}:
    delete:
      operationId: deleteAttribute
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Attribute deleted
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      security:
      - bearerAuth: []
      summary: Delete an attribute
      tags:
      - Attributes
    get:
      operationId: getAttribute
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeResponse"
          description: Attribute details
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      security:
      - bearerAuth: []
      summary: Get an attribute
      tags:
      - Attributes
    put:
      operationId: updateAttribute
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttributeRequest"
        required: true
      responses:
        "204":
          description: Attribute updated
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Update an attribute
      tags:
      - Attributes
  /attributes/{id}/reference:
    delete:
      operationId: deleteAttributeReferenceConfig
      parameters:
      - description: Attribute ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Reference config deleted
      security:
      - bearerAuth: []
      summary: Delete reference configuration for an attribute
      tags:
      - Attributes
    get:
      operationId: getAttributeReferenceConfig
      parameters:
      - description: Attribute ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceConfigResponse"
          description: Reference config
        "404":
          description: Reference config not found
      security:
      - bearerAuth: []
      summary: Get reference configuration for an attribute
      tags:
      - Attributes
    put:
      operationId: setAttributeReferenceConfig
      parameters:
      - description: Attribute ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetReferenceConfigRequest"
        required: true
      responses:
        "204":
          description: Reference config updated
        "400":
          description: Attribute is not a Reference type
        "404":
          description: Attribute not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Set or update reference configuration for an attribute
      tags:
      - Attributes
  /attributes/{id}/items/{itemId}:
    delete:
      operationId: deleteAttributeItem
      parameters:
      - description: Attribute ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: List Item ID
        explode: false
        in: path
        name: itemId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Item removed
        "404":
          description: Item or Attribute not found
      security:
      - bearerAuth: []
      summary: Remove a list item from an attribute
      tags:
      - Attributes
    put:
      operationId: updateAttributeItem
      parameters:
      - description: Attribute ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: List Item ID
        explode: false
        in: path
        name: itemId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListItemRequest"
        required: true
      responses:
        "204":
          description: Item updated
        "404":
          description: Item or Attribute not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Update a list item of an attribute
      tags:
      - Attributes
  /auth/me/permissions:
    get:
      description: "Returns the permissions for the authenticated user's current role.\
        \ Returns [\"*\"] for project owners (full access) or an empty array if no\
        \ role is assigned."
      operationId: getMyPermissions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getMyPermissions_200_response"
          description: List of permission strings
        "401":
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: Get current user's role permissions
      tags:
      - Auth
  /auth/google-login:
    post:
      description: "Authenticates a user using a Google ID token. If the user does\
        \ not exist, a new account is automatically created."
      operationId: googleLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/googleLogin_200_response"
          description: Login successful
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Failed
        "401":
          description: Invalid Google token
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Login or register via Google Sign-In
      tags:
      - Auth
  /auth/sessions:
    get:
      operationId: listSessions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listSessions_200_response"
          description: List of sessions
        "401":
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: List recent login sessions
      tags:
      - Auth
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/googleLogin_200_response"
          description: Login successful
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Failed
        "401":
          description: Invalid credentials
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Login user
      tags:
      - Auth
  /auth/refresh:
    post:
      description: Exchange a valid refresh token for a new access token and refresh
        token. The old refresh token is invalidated (rotation).
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/refreshToken_200_response"
          description: Token refresh successful
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/refreshToken_401_response"
          description: "Invalid, expired, or revoked refresh token"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Failed
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Refresh access token
      tags:
      - Auth
  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      parameters:
      - description: Session ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Session revoked
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Session not found
      security:
      - bearerAuth: []
      summary: Revoke a login session
      tags:
      - Auth
  /auth/switch-project:
    post:
      operationId: switchProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchProjectRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/googleLogin_200_response"
          description: Project switched successfully
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Failed
        "401":
          description: Unauthorized
        "403":
          description: Access Denied to Project
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Switch active project context
      tags:
      - Auth
  /automation/automations:
    get:
      operationId: listAutomations
      parameters:
      - description: Filter by template ID
        explode: true
        in: query
        name: templateId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: Filter by enabled status
        explode: true
        in: query
        name: isEnabled
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AutomationResponse"
                type: array
          description: List of automations
        "401":
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: List automations
      tags:
      - Automation - Automations
    post:
      operationId: createAutomation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAutomationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createAttributeItem_201_response"
          description: Automation created
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Tier quota exceeded
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Create a new automation
      tags:
      - Automation - Automations
  /automation/notification-channels:
    get:
      operationId: listNotificationChannels
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listNotificationChannels_200_response"
          description: List of channels
        "401":
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: List all notification channels
      tags:
      - Automation - Notification Channels
    post:
      operationId: createNotificationChannel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationChannelRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createAttributeItem_201_response"
          description: Channel created
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Tier quota exceeded
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Create a new notification channel
      tags:
      - Automation - Notification Channels
  /automation/automations/{id}:
    delete:
      operationId: deleteAutomation
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Automation deleted
        "401":
          description: Unauthorized
        "404":
          description: Automation not found
      security:
      - bearerAuth: []
      summary: Delete an automation
      tags:
      - Automation - Automations
    get:
      operationId: getAutomation
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationResponse"
          description: Automation details
        "401":
          description: Unauthorized
        "404":
          description: Automation not found
      security:
      - bearerAuth: []
      summary: Get an automation by ID
      tags:
      - Automation - Automations
    put:
      operationId: updateAutomation
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAutomationRequest"
        required: true
      responses:
        "204":
          description: Automation updated
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Automation not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Update an automation
      tags:
      - Automation - Automations
  /automation/notification-channels/{id}:
    delete:
      operationId: deleteNotificationChannel
      parameters:
      - description: Channel UUID
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Channel deleted
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      security:
      - bearerAuth: []
      summary: Delete a notification channel
      tags:
      - Automation - Notification Channels
    get:
      operationId: getNotificationChannel
      parameters:
      - description: Channel UUID
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannelResponse"
          description: Channel details
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      security:
      - bearerAuth: []
      summary: Get a notification channel
      tags:
      - Automation - Notification Channels
    put:
      operationId: updateNotificationChannel
      parameters:
      - description: Channel UUID
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationChannelRequest"
        required: true
      responses:
        "204":
          description: Channel updated
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Update a notification channel
      tags:
      - Automation - Notification Channels
  /automation/automations/{id}/executions:
    get:
      operationId: listAutomationExecutions
      parameters:
      - description: Automation ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Number of results
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          type: integer
        style: form
      - description: Pagination offset
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - description: Filter by status
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - pending
          - success
          - partial_failure
          - failed
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listAutomationExecutions_200_response"
          description: List of executions
        "401":
          description: Unauthorized
        "404":
          description: Automation not found
      security:
      - bearerAuth: []
      summary: List automation executions
      tags:
      - Automation - Automations
  /automation/push-devices:
    delete:
      operationId: unregisterPushDevice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnregisterPushDeviceRequest"
        required: true
      responses:
        "204":
          description: Device unregistered
        "401":
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Unregister a push notification device token
      tags:
      - Automation - Push Devices
    get:
      operationId: listPushDevices
      responses:
        "200":
          content:
            application/json:
              schema:
