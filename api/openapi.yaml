        - authorization_code
        - refresh_token
        redirect_uris:
        - https://claude.ai/api/mcp/oauth_callback
        - https://oauth.pstmn.io/v1/callback
        client_name: Claude Desktop
        token_endpoint_auth_method: none
        response_types:
        - code
