  schemas:
    AccessTokenResponse:
      description: Metadata describing an API access token (raw secret key is omitted
        for security)
      example:
        last_used_at: 2026-08-26T14:30:00Z
        expires_at: 2026-12-31T23:59:59Z
        name: CI/CD Deployment Key
        created_at: 2026-08-26T12:00:00Z
        id: 0192a543-7f28-72b1-9b7e-97c997321034
      properties:
        id:
          description: Unique UUIDv7 identifier of the access token
          example: 0192a543-7f28-72b1-9b7e-97c997321034
          format: uuid
          type: string
        name:
          description: Friendly human-readable label identifying the access token
          example: CI/CD Deployment Key
          type: string
        expires_at:
          description: Expiration timestamp in ISO 8601 UTC format
          example: 2026-12-31T23:59:59Z
          format: date-time
          type: string
        created_at:
          description: Creation timestamp in ISO 8601 UTC format
          example: 2026-08-26T12:00:00Z
          format: date-time
          type: string
        last_used_at:
          description: Timestamp when this token was last used to authenticate an
            API request
          example: 2026-08-26T14:30:00Z
          format: date-time
          nullable: true
          type: string
      title: Access Token Response
      type: object
    CreateAccessTokenRequest:
      description: Payload for generating a new programmatic API access token
      example:
        expires_at: 2026-12-31T23:59:59Z
        name: CI/CD Deployment Key
      properties:
        name:
          description: Friendly human-readable label to identify the token purpose
          example: CI/CD Deployment Key
          type: string
        expires_at:
          description: Expiration timestamp in ISO 8601 UTC format (e.g. 2026-12-31T23:59:59Z)
          example: 2026-12-31T23:59:59Z
          format: date-time
          type: string
      required:
      - expires_at
      - name
      title: Create Access Token Request
      type: object
    AddListItemRequest:
      description: Payload for adding a new item to a List attribute.
      example:
        id: 019a6b2c-8c3a-7c2e-8b3f-6c8a1a2b3c4d
        value: Green
        sort_order: 1
      properties:
        value:
          description: Display value / label for the new choice option.
          example: Green
