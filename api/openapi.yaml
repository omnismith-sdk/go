  /entities:
    post:
      description: |-
        Creates a new dynamic entity record conforming to a template schema.

        ### Template Association
        Specify the target schema via either `template_id` (UUID) or `template_slug` (human-readable slug).

        ### Dynamic Attribute Values (`attribute_values`)
        Each attribute entry supports identifier resolution and accepts either:
        - `attribute_id`: Canonical attribute UUID
        - `attribute_slug`: Attribute slug identifier (e.g. `price`, `sku`, `status`)

        ### Value Formatting Rules
        - **Dimension - Text / Markdown**: UTF-8 string value (e.g., `"Wireless Headphones"`)
        - **Dimension - Number**: Numeric string representation (e.g., `"129.99"`, `"42"`)
        - **Dimension - Boolean**: Strict boolean representation: `"true"`, `"false"`, `"1"`, or `"0"`
        - **Dimension - Date & Datetime**: Formatted as `YYYY-MM-DD` (date) or `YYYY-MM-DD HH:MM:SS` / ISO 8601 `YYYY-MM-DDTHH:MM:SSZ` (datetime)
        - **Dimension - File & Image**: UUID string of a pre-uploaded workspace file asset
        - **List Attribute**: Must provide the exact UUID string of a valid defined `ListItem` option
        - **Reference Attribute**: Must provide the exact UUID string of an existing referenced `Entity`

        ### Metric Telemetry Persistence
        Any metric attributes included in `attribute_values` are published directly to the metric ingestion pipeline and recorded in time-series telemetry storage.
      operationId: createEntity
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntityRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createEntity_201_response"
          description: Entity created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Tier quota exceeded
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Create a new dynamic entity
      tags:
      - Entity
  /entities/{id}:
    delete:
      description: |-
        Marks an entity record as soft-deleted by setting its `deleted_at` timestamp.

        Soft-deleted entities are immediately excluded from standard entity searches, BI row queries, and direct retrieval endpoints. Associated historical change logs and time-series telemetry remain preserved for audit compliance.
      operationId: deleteEntity
      parameters:
      - description: Unique entity identifier (UUID) to soft-delete
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Entity soft-deleted successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
      security:
      - bearerAuth: []
      summary: Soft-delete an entity record
      tags:
      - Entity
    get:
      description: |-
        Retrieves the full hydrated record for a dynamic entity by its unique identifier (UUID).

        ### Attribute Key Formatting (`attribute_key`)
        The `attribute_key` query parameter controls the dictionary keys in `attribute_values`:
        - `"id"` (default): Keys are canonical attribute UUIDs (e.g. `018b2f1b-8c1a...`).
        - `"slug"`: Keys are human-readable attribute slugs (e.g. `price`, `sku`, `category`), which is recommended for API consumers and AI agent workflows.

        ### Hydrated Attribute Values
        The returned `attribute_values` object includes both raw serialized values and resolved display labels (`custom_value`) for references and list options.
      operationId: getEntity
      parameters:
      - description: Unique entity identifier (UUID)
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "Format for attribute_values dictionary keys: \"id\" for attribute\
          \ UUIDs or \"slug\" for human-readable attribute slugs"
        example: slug
        explode: true
        in: query
        name: attribute_key
        required: false
        schema:
          default: id
          enum:
          - id
          - slug
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityResponse"
          description: Hydrated entity details
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
      security:
      - bearerAuth: []
      summary: Get an entity record by ID
      tags:
      - Entity
    patch:
      description: |-
        Updates specific dynamic attribute values for an existing entity record.

        ### Dynamic Attribute Values (`attribute_values`)
        Submit one or more attribute value updates. Each entry supports identifier resolution via:
        - `attribute_id`: Canonical attribute UUID
        - `attribute_slug`: Attribute slug identifier (e.g. `price`, `sku`, `status`)

        ### Value Formatting Rules
        - **Dimension - Text / Markdown**: UTF-8 string value
        - **Dimension - Number**: Numeric string representation (e.g. `"149.99"`)
        - **Dimension - Boolean**: Boolean representation: `"true"`, `"false"`, `"1"`, or `"0"`
        - **Dimension - Date & Datetime**: Formatted as `YYYY-MM-DD` or `YYYY-MM-DD HH:MM:SS` / ISO 8601 `YYYY-MM-DDTHH:MM:SSZ`
        - **Dimension - File & Image**: UUID string of a pre-uploaded workspace file asset
        - **List Attribute**: Must provide the exact UUID string of a valid defined `ListItem` option
        - **Reference Attribute**: Must provide the exact UUID string of an existing referenced `Entity`

        ### Audit Trail & Metrics
        - Dimension updates are recorded in the append-only entity dimension change history log.
        - Metric attribute values submitted here are dispatched to the metric streaming pipeline for time-series aggregation.
      operationId: updateEntity
      parameters:
      - description: Unique entity identifier (UUID)
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEntityRequest"
        required: true
      responses:
        "204":
          description: Entity attributes updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Tier quota exceeded
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Update entity attribute values
      tags:
      - Entity
  /entities/export/{template_id}:
    post:
      description: |-
        Exports entity records of a template schema matching filter criteria as a streaming CSV download.

        ### Re-importable CSV Schema Format
        The generated CSV conforms to the Omnismith two-row metadata specification, making it directly compatible with `POST /entities/import/{template_id}`:
        - **Row 1**: Display column names and attribute aliases.
        - **Row 2**: Metadata row prefixed with `#` containing attribute UUIDs and column IDs (e.g. `#id`, `#018b2f1b-8c1a...`).
        - **Row 3+**: Entity data records.

        ### Filter & Search Model
        Accepts the same filtering payload as `SearchEntities`: structured `filters` (supporting `eq`, `neq`, `gt`, `lt`, `like`, `not-like`, `empty`, `not-empty`) and `global_search` text queries.

        ### Sorting
        Sort results via `sort_field` (attribute UUID, slug, or standard timestamp) and `sort_direction` (`asc`/`desc`).
      operationId: exportEntities
      parameters:
      - description: Unique identifier (UUID) of the template schema to export
        example: 018b2f1b-8c1a-75b3-8000-7f0000010001
        explode: false
        in: path
        name: template_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "Attribute UUID, attribute slug, or standard field (id, created_at,\
          \ updated_at, deleted_at) to sort by"
        example: created_at
        explode: true
        in: query
        name: sort_field
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: "Sort direction: \"asc\" (ascending) or \"desc\" (descending)"
        example: asc
        explode: true
        in: query
        name: sort_direction
        required: false
        schema:
          default: asc
          enum:
          - asc
          - desc
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportEntitiesRequest"
        required: true
      responses:
        "200":
          content:
            text/csv:
              schema:
                format: binary
                type: string
          description: CSV file download stream
          headers:
            Content-Disposition:
              description: Attachment header with dynamic filename
              explode: false
              schema:
                example: attachment; filename="export_product_catalog_2026-08-26_12-00-00.csv"
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Export entities to structured CSV file
      tags:
      - Entity
  /entities/{id}/chart:
    get:
      description: |-
        Retrieves aggregated, time-bucketed metric time-series data for an entity.

        ### Metric Attribute Filtering (`attribute_ids`)
        Pass one or more comma-separated metric attribute UUIDs to aggregate across the query window.

        ### Aggregation Functions (`aggregate_func`)
        Supported aggregation operations within each bucket:
        - `avg` (default): Arithmetic mean of values
        - `sum`: Sum total of values
        - `min` / `max`: Minimum / Maximum observed value
        - `count`: Number of recorded observations
        - `first` / `last`: Earliest / Latest observation within the time bucket

        ### Time Intervals & Bucket Widths (`bucket_width`)
        Values follow standard time interval notation: `1 second`, `5 seconds`, `10 seconds`, `1 minute` (1m), `5 minutes` (5m), `10 minutes`, `15 minutes`, `30 minutes`, `1 hour` (1h), `6 hours`, `12 hours`, `1 day` (1d), `1 week`, `1 month`.

        ### Query Window (`start` & `end`)
        Query range is defined by `start` and `end` timestamps supplied as integer Unix epoch seconds.
      operationId: getEntityChart
      parameters:
      - description: Unique entity identifier (UUID)
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Comma-separated metric attribute UUIDs to aggregate
        example: "018b2f1b-8c1a-75b3-8000-7f0000010010,018b2f1b-8c1a-75b3-8000-7f0000010011"
        explode: true
        in: query
        name: attribute_ids
        required: true
        schema:
          type: string
        style: form
      - description: Aggregation function applied within each bucket
        example: avg
        explode: true
        in: query
        name: aggregate_func
        required: false
        schema:
          default: avg
          enum:
          - sum
          - avg
          - min
          - max
          - count
          - first
          - last
          type: string
        style: form
      - description: "Time bucket width interval (e.g. 1 minute, 5 minutes, 1 hour,\
          \ 1 day)"
        example: 1 hour
        explode: true
        in: query
        name: bucket_width
        required: false
        schema:
          default: 1 hour
          enum:
          - 1 second
          - 5 seconds
          - 10 seconds
          - 1 minute
          - 5 minutes
          - 10 minutes
          - 15 minutes
          - 30 minutes
          - 1 hour
          - 6 hours
          - 12 hours
          - 1 day
          - 1 week
          - 1 month
          type: string
        style: form
      - description: Start timestamp as Unix epoch in seconds
        example: 1774396800
        explode: true
        in: query
        name: start
        required: true
        schema:
          type: integer
        style: form
      - description: End timestamp as Unix epoch in seconds
        example: 1774483200
        explode: true
        in: query
        name: end
        required: true
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getEntityChart_200_response"
          description: Chart time-series data grouped by attribute
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Get entity chart time-series data
      tags:
      - Entity
  /entities/{id}/history:
    get:
      description: |-
        Retrieves the immutable change audit log for an entity's dimension attribute mutations.

        ### Dedicated Dimension Audit Log
        Records all historical mutations to dimension, list, and reference attribute values. High-volume metric telemetry observations bypass this log and are stored in dedicated time-series storage, keeping the audit log clean and performant.

        ### Filtering & Search
        - `attribute_ids`: Filter by one or more comma-separated attribute UUIDs.
        - `search`: Text search matching historical serialized values.
        - `start` and `end`: Filter history records within a timestamp window (ISO 8601 or `YYYY-MM-DD HH:MM:SS`).
        - `author_email`: Filter by the actor who performed the mutation.

        ### Pagination & Sorting
        Supports 1-indexed pagination (`page`, `limit` up to 100) and sorting by `created_at`, `attribute_id`, or `value` (`asc`/`desc`).
      operationId: getEntityHistory
      parameters:
      - description: Unique entity identifier (UUID)
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: 1-based page number for pagination
        example: 1
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - description: Number of history records per page (1-100)
        example: 20
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Field to sort change logs by
        example: created_at
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: created_at
          enum:
          - created_at
          - attribute_id
          - value
          type: string
        style: form
      - description: "Sort direction: \"asc\" (ascending) or \"desc\" (descending)"
        example: desc
        explode: true
        in: query
        name: sort_direction
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: Free-text search filter matching against old and new attribute
          values
        example: Electronics
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated attribute UUIDs to filter change history
        example: "018b2f1b-8c1a-75b3-8000-7f0000010002,018b2f1b-8c1a-75b3-8000-7f0000010003"
        explode: true
        in: query
        name: attribute_ids
        required: false
        schema:
          type: string
        style: form
      - description: Filter change records occurring on or after this timestamp (ISO
