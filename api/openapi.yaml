      tags:
      - Automation - Notification Channels
  /automation/automations/{id}/executions:
    get:
      description: "Retrieves paginated execution logs and audit history for a specific\
        \ automation rule. Each execution log records the triggering entity ID, trigger\
        \ timestamp, execution completion time, final status (`pending`, `success`,\
        \ `partial_failure`, `failed`), detailed action dispatch outcomes with error\
        \ messages, and top-level execution errors."
      operationId: listAutomationExecutions
      parameters:
      - description: Automation UUID to fetch execution history for
        example: 01912ecb-4654-7890-a1b2-c3d4e5f60001
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Maximum number of execution log entries to return per page
        example: 20
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          type: integer
        style: form
      - description: Number of execution log records to skip for pagination
        example: 0
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - description: Filter execution logs by execution outcome status
        example: success
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - pending
          - success
          - partial_failure
          - failed
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listAutomationExecutions_200_response"
          description: Paginated list of execution logs
        "401":
          description: Unauthorized
        "404":
          description: Automation not found
      security:
      - bearerAuth: []
      summary: List automation execution logs
      tags:
      - Automation - Automations
  /automation/push-devices:
