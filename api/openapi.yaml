openapi: 3.0.0
info:
  description: API Documentation for Omnismith
  title: Omnismith API
  version: 1.0.12
  x-logo:
    url: https://omnismith.io/logo.png
    backgroundColor: transparent
    altText: Omnismith
servers:
- description: Production Server
  url: https://api.omnismith.io/v1
- description: Local Development Server
  url: http://localhost:8100
tags:
- description: AccessTokens
  name: AccessTokens
- description: Attributes
  name: Attributes
- description: AuditLog
  name: AuditLog
- description: Auth
  name: Auth
- description: Automation - Automations
  name: Automation - Automations
- description: Automation - Notification Channels
  name: Automation - Notification Channels
- description: Automation - Push Devices
  name: Automation - Push Devices
- description: BI
  name: BI
- description: Billing
  name: Billing
- description: Dashboards
  name: Dashboards
- description: Dashboard Blocks
  name: Dashboard Blocks
- description: Schema
  name: Schema
- description: Entity
  name: Entity
- description: Feedback
  name: Feedback
- description: FileAttachment
  name: FileAttachment
- description: Marketplace
  name: Marketplace
- description: OAuth
  name: OAuth
- description: Projects
  name: Projects
- description: Roles
  name: Roles
- description: Templates
  name: Templates
- description: User
  name: User
- description: Workspaces
  name: Workspaces
paths:
  /access-tokens:
    get:
      description: "Retrieves all active and expired programmatic API access tokens\
        \ created by the authenticated user for the active project context. Returns\
        \ token metadata including unique ID, user-assigned label, creation date,\
        \ expiration timestamp, and last used timestamp. Note: raw secret API keys\
        \ are only displayed once upon generation and are never returned in list responses."
      operationId: listAccessTokens
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listAccessTokens_200_response"
          description: List of access token metadata records
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
      security:
      - bearerAuth: []
      summary: List API access tokens
      tags:
      - AccessTokens
    post:
      description: Generates a new programmatic API access token prefixed with `omni_`
        (e.g. `omni_live_secret_key_...`) for the authenticated user within the active
        project context. The token inherits the user's current role permissions and
        scopes for authenticating automated API clients and scripts. The raw secret
        key is returned exactly once in the response and cannot be recovered later.
      operationId: createAccessToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessTokenRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createAccessToken_201_response"
          description: Access token generated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Create a programmatic API access token
      tags:
      - AccessTokens
  /access-tokens/{id}:
    delete:
      description: Permanently revokes and removes a programmatic API access token
        by its unique identifier. Any future API request using the revoked secret
        key will immediately fail authentication with a 401 Unauthorized status.
      operationId: deleteAccessToken
      parameters:
      - description: Unique UUIDv7 identifier of the access token to delete
        example: 0192a543-7f28-72b1-9b7e-97c997321034
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Access token deleted successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
      security:
      - bearerAuth: []
      summary: Delete an API access token
      tags:
      - AccessTokens
  /attributes/{id}/items:
    get:
      description: "Retrieves all selectable choice option items for a List-type (attribute_type\
        \ = 2) attribute in ascending sort order. Each item contains its UUID, parent\
        \ attribute ID, string value, and sort rank."
      operationId: listAttributeItems
      parameters:
      - description: UUID of the List-type attribute
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listAttributeItems_200_response"
          description: List of option items for the attribute
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
      security:
      - bearerAuth: []
      summary: List items of an attribute
      tags:
      - Attributes
    post:
      description: Appends a single selectable choice option item to a List-type (attribute_type
        = 2) attribute. Returns the generated or assigned UUID of the newly created
        list item.
      operationId: createAttributeItem
      parameters:
      - description: UUID of the List-type attribute
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddListItemRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createAttributeItem_201_response"
          description: List item created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request - Attribute is not a List type
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Add a list item to an attribute
      tags:
      - Attributes
    put:
      description: "Atomically replaces all selectable option items for a List-type\
        \ (attribute_type = 2) attribute. Existing list items for this attribute are\
        \ removed and replaced with the provided array of items (with values, sort\
        \ orders, and optional custom UUIDs). Returns HTTP 400 if the target attribute\
        \ is not of List kind."
      operationId: setAttributeItems
      parameters:
      - description: UUID of the List-type attribute
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetListItemsRequest"
        required: true
      responses:
        "204":
          description: List items replaced successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request - Attribute is not a List type
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Set list items for an attribute (replaces all existing items)
      tags:
      - Attributes
  /attributes:
    get:
      description: "Retrieves all schema attributes defined in the active project.\
        \ Attributes represent the core schema building blocks across 4 kinds: Dimension\
        \ (0), Metric (1), List (2), and Reference (3). Each attribute defines its\
        \ storage data type (String: 0, Number: 1, Boolean: 2, Datetime: 3, Date:\
        \ 4, File: 5, Image: 6, Markdown: 7), unique slug, optional description, associated\
        \ templates, and reference configurations."
      operationId: listAttributes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listAttributes_200_response"
          description: List of all project attributes
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: List all attributes
      tags:
      - Attributes
    post:
      description: "Defines a new attribute in the project schema. Attributes can\
        \ be of kind Dimension (0), Metric (1), List (2), or Reference (3). Specify\
        \ the storage data type (String: 0, Number: 1, Boolean: 2, Datetime: 3, Date:\
        \ 4, File: 5, Image: 6, Markdown: 7), name, optional project-unique slug (auto-generated\
        \ from name if omitted), optional template associations, and an optional reference_config\
        \ if kind is Reference (3). Subject to project tier quota constraints."
      operationId: createAttribute
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttributeRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createAttribute_201_response"
          description: Attribute successfully created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Tier quota exceeded
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Create a new attribute
      tags:
      - Attributes
  /attributes/{id}:
    delete:
      description: "Soft-deletes an attribute from the project schema. Soft-deleted\
        \ attributes are removed from active template projections and future queries,\
        \ while existing historical dimension and telemetry records remain preserved\
        \ for audit integrity."
      operationId: deleteAttribute
      parameters:
      - description: UUID of the attribute to delete
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Attribute deleted successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
      security:
      - bearerAuth: []
      summary: Delete an attribute
      tags:
      - Attributes
    get:
      description: "Retrieves complete attribute metadata by its UUID, including kind\
        \ (Dimension: 0, Metric: 1, List: 2, Reference: 3), storage data type, assigned\
        \ template IDs, creation timestamps, and reference configuration if applicable."
      operationId: getAttribute
      parameters:
      - description: UUID of the attribute to fetch
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeResponse"
          description: Attribute details
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
      security:
      - bearerAuth: []
      summary: Get an attribute by ID
      tags:
      - Attributes
    patch:
      description: "Applies partial modifications to an existing attribute without\
        \ overwriting omitted fields. Allows independently changing name, description,\
        \ slug, template associations, reference configuration, or transitioning data\
        \ type. Lossless data type transition rules apply when updating data_type\
        \ (Dimension only: Number(1)->String(0), Boolean(2)->String(0), Date(4)<->Datetime(3),\
        \ Date(4)/Datetime(3)->String(0), String(0)<->Markdown(7)). Template associations\
        \ merge and preserve restricted templates."
      operationId: patchAttribute
      parameters:
      - description: UUID of the attribute to patch
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAttributeRequest"
        required: true
      responses:
        "204":
          description: Attribute patched successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Patch an attribute (granular partial update)
      tags:
      - Attributes
    put:
      description: "Performs a full update of an existing attribute definition. Supports\
        \ updating name, description, slug, template associations, reference configuration,\
        \ and lossless data type transitions. Data type transitions are permitted\
        \ only for Dimension (0) attributes and must follow lossless compatibility:\
        \ Number(1) -> String(0), Boolean(2) -> String(0), Date(4) <-> Datetime(3),\
        \ Date(4)/Datetime(3) -> String(0), and String(0) <-> Markdown(7). Non-lossless\
        \ transitions or transitions on non-dimension attributes will return HTTP\
        \ 422. Template associations preserve restricted templates the caller cannot\
        \ see."
      operationId: updateAttribute
      parameters:
      - description: UUID of the attribute to update
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttributeRequest"
        required: true
      responses:
        "204":
          description: Attribute updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Update an attribute (full replacement)
      tags:
      - Attributes
  /attributes/{id}/reference:
    delete:
      description: Removes the foreign entity reference configuration mapping from
        a Reference-type (attribute_type = 3) attribute.
      operationId: deleteAttributeReferenceConfig
      parameters:
      - description: UUID of the Reference attribute
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Reference configuration deleted successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
      security:
      - bearerAuth: []
      summary: Delete reference configuration for an attribute
      tags:
      - Attributes
    get:
      description: Retrieves the relational reference target configuration for a Reference-type
        (attribute_type = 3) attribute. Returns the target template UUID and target
        display attribute UUID used for entity reference pointer resolution.
      operationId: getAttributeReferenceConfig
      parameters:
      - description: UUID of the Reference attribute
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceConfigResponse"
          description: Reference configuration details
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found - Reference configuration not found
      security:
      - bearerAuth: []
      summary: Get reference configuration for an attribute
      tags:
      - Attributes
    put:
      description: Sets or updates the target template and display attribute for a
        Reference-type (attribute_type = 3) attribute. Enables relational linking
        and foreign entity display label resolution. Returns HTTP 400 if the target
        attribute is not of Reference kind.
      operationId: setAttributeReferenceConfig
      parameters:
      - description: UUID of the Reference attribute
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetReferenceConfigRequest"
        required: true
      responses:
        "204":
          description: Reference configuration updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request - Attribute is not a Reference type
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Set or update reference configuration for an attribute
      tags:
      - Attributes
  /attributes/{id}/items/{itemId}:
    delete:
      description: Permanently deletes a specific selectable option item from a List-type
        (attribute_type = 2) attribute. Validates that the list item exists and belongs
        to the specified attribute before deletion.
      operationId: deleteAttributeItem
      parameters:
      - description: UUID of the parent List attribute
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: UUID of the list item to delete
        example: 019a6b2c-8c3a-7c2e-8b3f-6c8a1a2b3c4d
        explode: false
        in: path
        name: itemId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: List item deleted successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found - List item or Attribute not found
      security:
      - bearerAuth: []
      summary: Remove a list item from an attribute
      tags:
      - Attributes
    put:
      description: Updates the display value and/or sort order of an existing list
        item belonging to a List-type (attribute_type = 2) attribute. Validates that
        the list item exists and belongs to the specified attribute.
      operationId: updateAttributeItem
      parameters:
      - description: UUID of the parent List attribute
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: UUID of the list item to update
        example: 019a6b2c-8c3a-7c2e-8b3f-6c8a1a2b3c4d
        explode: false
        in: path
        name: itemId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListItemRequest"
        required: true
      responses:
        "204":
          description: List item updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found - List item or Attribute not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Update a list item of an attribute
      tags:
      - Attributes
  /audit-logs:
    get:
      description: |-
        Returns an immutable, time-ordered audit trail of user and system events for the current project context.

        ### Security & Authorization
        Restricted to authenticated users holding the Project Owner role.

        ### Comprehensive Filtering & Search
        - `event_type`: Filter by single or comma-separated event types (e.g. `entity.created`, `entity.updated`, `entity.deleted`, `template.created`).
        - `resource_type`: Filter by domain target (e.g. `entity`, `template`, `attribute`, `project`).
        - `resource_id`: Filter by exact resource UUID.
        - `author_email`: Filter by the actor email address.
        - `start` and `end`: Date-time window bounding event occurrence (ISO 8601 or `YYYY-MM-DD HH:MM:SS`).
        - `search`: Text search across event types, resource types, resource IDs, author emails, and value summaries.

        ### Pagination & Sorting
        Supports 1-indexed pagination (`page`, `limit` up to 100) and sorting by `occurred_at`, `event_type`, `resource_type`, `resource_id`, or `author_email` (`asc`/`desc`).
      operationId: listAuditLogs
      parameters:
      - description: 1-based page number for pagination
        example: 1
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - description: Number of audit log records per page (1-100)
        example: 20
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Field to sort audit log entries by
        example: occurred_at
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: occurred_at
          enum:
          - occurred_at
          - event_type
          - resource_type
          - resource_id
          - author_email
          type: string
        style: form
      - description: "Sort direction: \"asc\" (ascending) or \"desc\" (descending)"
        example: desc
        explode: true
        in: query
        name: sort_direction
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: "Text search filter across event_type, resource_type, resource_id,\
          \ author_email, and value"
        example: entity.created
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: "Filter by single or comma-separated event types (e.g. \"entity.created,entity.updated\"\
          )"
        example: entity.created
        explode: true
        in: query
        name: event_type
        required: false
        schema:
          type: string
        style: form
      - description: "Filter by single or comma-separated resource types (e.g. \"\
          entity,template,attribute\")"
        example: entity
        explode: true
        in: query
        name: resource_type
        required: false
        schema:
          type: string
        style: form
      - description: Filter by exact resource unique identifier (UUID)
        example: 018b2f1b-8c1a-75b3-8000-7f0000010000
        explode: true
        in: query
        name: resource_id
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: Filter by actor or author email address
        example: demo@omnismith.io
        explode: true
        in: query
        name: author_email
        required: false
        schema:
          type: string
        style: form
      - description: Filter audit records occurring on or after this timestamp (ISO
          8601 format)
        example: 2026-08-01T00:00:00Z
        explode: true
        in: query
        name: start
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Filter audit records occurring on or before this timestamp (ISO
          8601 format)
        example: 2026-08-26T23:59:59Z
        explode: true
        in: query
        name: end
        required: false
        schema:
          format: date-time
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listAuditLogs_200_response"
          description: Paginated list of audit log records
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
      security:
      - bearerAuth: []
      summary: List project audit logs
      tags:
      - AuditLog
  /auth/me/permissions:
    get:
      description: "Returns the complete list of permission strings granted to the\
        \ authenticated user under their active project role. Returns `[\"*\"]` for\
        \ project owners who possess full root administrative privileges, or an array\
        \ of granular permission keys (e.g. `entity.view`, `template.create`, `billing.view_usage`)\
        \ for custom assigned roles. Returns an empty array if no role is currently\
        \ assigned."
      operationId: getMyPermissions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getMyPermissions_200_response"
          description: List of permission strings
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: Get current user role permissions
      tags:
      - Auth
  /auth/google-login:
    post:
      description: "Authenticates a user using a Google Identity Services (GIS) ID\
        \ token. Verifies the cryptographic token signature against Google public\
        \ keys. If no account exists for the verified email address, a new user account\
        \ is automatically provisioned and verified. Returns a JWT access token and\
        \ refresh token for the active session."
      operationId: googleLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/googleLogin_200_response"
          description: Authentication successful with issued JWT access and refresh
            tokens
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Authenticate or register with Google Sign-In
      tags:
      - Auth
  /auth/google-login-redirect:
    post:
      description: "Handles Google Identity Services form-urlencoded POST redirection\
        \ (`credential` and `g_csrf_token`). Authenticates or provisions the user\
        \ account, initiates an active session, and redirects the browser (HTTP 302)\
        \ to the frontend application callback URL with JWT access and refresh tokens\
        \ embedded in the URL fragment."
      operationId: googleLoginRedirect
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/googleLoginRedirect_request"
        required: true
      responses:
        "302":
          description: Redirects to the frontend application callback route (/auth/google-callback#...)
            with authentication tokens in the URL fragment
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
      summary: Google OAuth callback redirect handler
      tags:
      - Auth
  /auth/sessions:
    get:
      description: "Retrieves all login sessions recorded for the authenticated user\
        \ across devices and browsers. Each session record includes client metadata\
        \ (IP address, User-Agent), issuance timestamp, expiration date, current status\
        \ (`active`, `expired`, `revoked`), and revocation details if applicable."
      operationId: listSessions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listSessions_200_response"
          description: List of login session records
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: List active and historical user sessions
      tags:
      - Auth
  /auth/login:
    post:
      description: "Authenticates an existing user account using email and password.\
        \ Upon successful validation, generates an active login session and returns\
        \ a short-lived JWT access token and a refresh token for rotating credentials."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/googleLogin_200_response"
          description: Authentication successful with issued JWT access and refresh
            tokens
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Authenticate user with email and password
      tags:
      - Auth
  /auth/refresh:
    post:
      description: "Exchanges a valid refresh token for a newly issued JWT access\
        \ token and a rotated refresh token. Implements strict single-use refresh\
        \ token rotation: the supplied refresh token is permanently invalidated upon\
        \ successful exchange. If an expired, already-rotated, or revoked token is\
        \ presented, the request is rejected."
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/refreshToken_200_response"
          description: Token refresh successful with rotated credentials
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/refreshToken_401_response"
          description: "Invalid, expired, or revoked refresh token"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      summary: Rotate refresh token and issue new access token
      tags:
      - Auth
  /auth/sessions/{id}:
    delete:
      description: "Immediately revokes a specific user login session by its unique\
        \ session ID. All refresh tokens issued within this session are invalidated,\
        \ preventing further token refreshes. If the revoked session corresponds to\
        \ the current client connection, subsequent refresh attempts will fail."
      operationId: revokeSession
      parameters:
      - description: Unique UUID identifier of the session to revoke
        example: 018b2f1b-7c3a-7d2e-8f1a-2b3c4d5e6f7a
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Session revoked successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
      security:
      - bearerAuth: []
      summary: Revoke an active login session
      tags:
      - Auth
  /auth/switch-project:
    post:
      description: "Switches the active multi-tenancy project context for the authenticated\
        \ user session. Verifies that the user is an active member or owner of the\
        \ target project, then issues a new JWT access token and refresh token containing\
        \ updated claims for the selected project_id and the user's assigned role."
      operationId: switchProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchProjectRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/switchProject_200_response"
          description: Project switched successfully with issued project-scoped JWT
            access and refresh tokens
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Switch active project context
      tags:
      - Auth
  /automation/automations:
    get:
      description: "Retrieves all automation rules configured within the current project\
        \ context. Automations define event-driven workflows triggered by entity lifecycle\
        \ events (such as entity creation, attribute updates, or metric threshold\
        \ changes), evaluated against multi-attribute conditions, and dispatched to\
        \ configured action channels (Telegram, webhooks, mobile push). Results can\
        \ be filtered by entity template or active status."
      operationId: listAutomations
      parameters:
      - description: Filter automations scoped to a specific entity template UUID
        example: 01912ecb-4654-7890-a1b2-c3d4e5f60088
        explode: true
        in: query
        name: templateId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - description: "Filter automations by active enabled status (true for active\
          \ rules, false for paused rules)"
        example: true
        explode: true
        in: query
        name: isEnabled
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AutomationResponse"
                type: array
          description: List of automation rules
        "401":
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: List project automations
      tags:
      - Automation - Automations
    post:
      description: "Creates a new event-driven automation rule within the current\
        \ project. Configures event trigger criteria (such as `on_entity_created`,\
        \ `on_entity_updated`, or `on_attribute_changed`), multi-condition filters\
        \ evaluating attribute values (using operators `eq`, `neq`, `gt`, `gte`, `lt`,\
        \ `lte`, `contains`, `not_contains`, `is_empty`, `is_not_empty` across current\
        \ value or delta modes), automated action targets (`telegram`, `webhook`,\
        \ `push`), and an optional cooldown window in seconds to throttle repeated\
        \ firings for the same entity."
      operationId: createAutomation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAutomationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createAutomation_201_response"
          description: Automation successfully created
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Tier quota exceeded
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Create an automation rule
      tags:
      - Automation - Automations
  /automation/notification-channels:
    get:
      description: "Retrieves all notification delivery channels configured within\
        \ the current project. Channels are reusable destination targets for automation\
        \ alerts, supporting Telegram bots, external HTTP webhooks, and mobile push\
        \ notifications. Sensitive credentials are sanitized in list outputs."
      operationId: listNotificationChannels
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listNotificationChannels_200_response"
          description: List of configured notification channels
        "401":
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: List notification channels
      tags:
      - Automation - Notification Channels
    post:
      description: "Registers a new external notification channel for the current\
        \ project. Channels can be of type `telegram` (configured with a Telegram\
        \ bot token), `webhook` (configured with endpoint URL, custom HTTP headers,\
        \ and authentication methods such as bearer token or basic auth), or `push`\
        \ (FCM mobile push notifications). Configured channels can then be linked\
        \ as target actions in automation rules."
      operationId: createNotificationChannel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationChannelRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createNotificationChannel_201_response"
          description: Notification channel successfully created
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Tier quota exceeded
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Create a notification channel
      tags:
      - Automation - Notification Channels
  /automation/automations/{id}:
    delete:
      description: "Permanently deletes an automation rule by UUID, unbinding event\
        \ listeners and stopping all future evaluations and action dispatches for\
        \ that rule."
      operationId: deleteAutomation
      parameters:
      - description: Unique automation UUID to delete
        example: 01912ecb-4654-7890-a1b2-c3d4e5f60001
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Automation successfully deleted
        "401":
          description: Unauthorized
        "404":
          description: Automation not found
      security:
      - bearerAuth: []
      summary: Delete an automation
      tags:
      - Automation - Automations
    get:
      description: "Retrieves the complete configuration of a specific automation\
        \ rule by its UUID, including trigger event types, template/attribute references,\
        \ condition comparison expressions, action payloads, execution cooldown interval,\
        \ and the timestamp of its last execution."
      operationId: getAutomation
      parameters:
      - description: Unique automation UUID
        example: 01912ecb-4654-7890-a1b2-c3d4e5f60001
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationResponse"
          description: Automation details
        "401":
          description: Unauthorized
        "404":
          description: Automation not found
      security:
      - bearerAuth: []
      summary: Get an automation by ID
      tags:
      - Automation - Automations
    put:
      description: "Updates an existing automation rule by UUID. Supports modifying\
        \ rule name, description, trigger event definitions, condition filter criteria,\
        \ action dispatches, and cooldown throttle settings."
      operationId: updateAutomation
      parameters:
      - description: Unique automation UUID to update
        example: 01912ecb-4654-7890-a1b2-c3d4e5f60001
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAutomationRequest"
        required: true
      responses:
        "204":
          description: Automation successfully updated
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Automation not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: Update an automation
      tags:
      - Automation - Automations
  /automation/notification-channels/{id}:
    delete:
      description: Permanently removes a notification channel from the project by
        UUID. Automations referencing this channel must be updated to prevent dispatch
        delivery failures.
      operationId: deleteNotificationChannel
      parameters:
