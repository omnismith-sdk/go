  /bi/schema:
    get:
      description: |-
        Returns a normalized metadata catalog of all template schemas and dynamic attribute definitions in the current workspace context.

        ### BI Tooling Compatibility
        Designed for BI connectors (PowerBI, Tableau, Looker Studio, Metabase) and ETL ingestion pipelines. Translates dynamic template schemas into relational column definitions, data types (`string`, `number`, `boolean`, `datetime`, `date`), reference join keys, and allowed list options.
      operationId: getBiSchema
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiSchemaResponse"
          description: Normalized BI schema catalog
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: Get BI schema catalog
      tags:
      - BI
  /bi/templates/{template_id}/rows:
    post:
      description: |-
        Returns a flattened, relational row-based live dataset for a template, optimized for BI dashboards, spreadsheets, and reporting tools.

        ### Tabular Data Model
        Transforms dynamic entity records into flat rows where columns correspond to the attribute definitions retrieved from `GET /bi/schema`.

        ### Filter & Search Model
        Supports structured `filters` (operators: `eq`, `neq`, `gt`, `lt`, `like`, `not-like`, `empty`, `not-empty`) and `global_search` text queries.

        ### Sorting & Pagination
        - `sort_field`: Attribute UUID, slug, or standard column (`id`, `created_at`, `updated_at`, `deleted_at`).
        - `sort_direction`: `asc` or `desc`.
        - `limit` (max 100) and `offset` pagination.
      operationId: listBiTemplateRows
      parameters:
      - description: Unique identifier (UUID) of the template schema to query
        example: 018b2f1b-8c1a-75b3-8000-7f0000010001
        explode: false
        in: path
        name: template_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Maximum number of rows to return per page (1-100)
        example: 50
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          type: integer
        style: form
      - description: Zero-based pagination offset
        example: 0
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - description: "Attribute UUID, slug, or standard field (id, created_at, updated_at,\
          \ deleted_at) to sort by"
        example: created_at
        explode: true
        in: query
        name: sort_field
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: "Sort direction: \"asc\" (ascending) or \"desc\" (descending)"
        example: desc
        explode: true
        in: query
        name: sort_direction
        required: false
        schema:
          default: asc
          enum:
          - asc
          - desc
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiListTemplateRowsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiTemplateRowsResponse"
          description: Flat dataset rows with column definitions
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: List flattened template rows for BI integration
      tags:
      - BI
  /bi/templates/{template_id}/time-series:
    post:
      description: |-
        Returns aggregated, time-bucketed metric data points across entities of a template schema for BI and analytical visualization tools.

        ### Combined Dimension Filtering & Metric Aggregation
        Combines entity dimension filtering (scoped via the `filters` and `global_search` body payload) with time-series rollup across the specified `attribute_ids`.

        ### Aggregation Functions (`aggregate_func`)
        - `avg` (default), `sum`, `min`, `max`, `count`, `first`, `last`.

        ### Bucket Intervals (`bucket_width`)
        Values follow standard time interval notation: `1 second`, `5 seconds`, `10 seconds`, `1 minute` (1m), `5 minutes` (5m), `10 minutes`, `15 minutes`, `30 minutes`, `1 hour` (1h), `6 hours`, `12 hours`, `1 day` (1d), `1 week`, `1 month`.

        ### Query Window (`start` & `end`)
        Specified as integer Unix epoch seconds bounding the telemetry observations.
      operationId: listBiTemplateTimeSeries
      parameters:
      - description: Unique identifier (UUID) of the template schema
        example: 018b2f1b-8c1a-75b3-8000-7f0000010001
        explode: false
        in: path
        name: template_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Comma-separated metric attribute UUIDs to aggregate
        example: "018b2f1b-8c1a-75b3-8000-7f0000010010,018b2f1b-8c1a-75b3-8000-7f0000010011"
        explode: true
        in: query
        name: attribute_ids
        required: true
        schema:
          type: string
        style: form
      - description: Aggregation function applied within each time bucket
        example: avg
        explode: true
        in: query
        name: aggregate_func
        required: false
        schema:
          default: avg
          enum:
          - sum
          - avg
          - min
          - max
          - count
          - first
          - last
          type: string
        style: form
      - description: "Time bucket width interval (e.g. 1 minute, 5 minutes, 1 hour,\
          \ 1 day)"
        example: 1 hour
        explode: true
        in: query
        name: bucket_width
        required: false
        schema:
          default: 1 hour
          enum:
          - 1 second
          - 5 seconds
          - 10 seconds
          - 1 minute
          - 5 minutes
          - 10 minutes
          - 15 minutes
          - 30 minutes
          - 1 hour
          - 6 hours
          - 12 hours
          - 1 day
          - 1 week
          - 1 month
          type: string
        style: form
      - description: Start timestamp as Unix epoch in seconds
        example: 1774396800
        explode: true
        in: query
        name: start
        required: true
        schema:
          type: integer
        style: form
      - description: End timestamp as Unix epoch in seconds
        example: 1774483200
        explode: true
        in: query
        name: end
        required: true
        schema:
          type: integer
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiListTemplateRowsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiTimeSeriesResponse"
          description: Flat time-series dataset
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Validation Error
      security:
      - bearerAuth: []
      summary: List aggregated time-series rows for BI integration
      tags:
      - BI
