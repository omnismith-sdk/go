      operationId: updateNotificationChannel
      parameters:
      - description: Unique notification channel UUID to update
        example: 01912ecb-4654-7890-a1b2-c3d4e5f60002
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationChannelRequest"
        required: true
      responses:
        "204":
          description: Notification channel successfully updated
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Notification channel not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
