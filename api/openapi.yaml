          items:
            format: uri
            type: string
          type: array
        grant_types:
          description: Authorized OAuth grant types for this client
          example:
          - authorization_code
          - refresh_token
          items:
            type: string
          type: array
        response_types:
          description: Authorized OAuth response types for this client
          example:
          - code
          items:
            type: string
          type: array
        token_endpoint_auth_method:
          description: Client authentication method used when calling the token endpoint
          enum:
          - none
          - client_secret_post
          - client_secret_basic
          example: none
          type: string
      required:
