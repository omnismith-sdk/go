        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/approveOAuthAuthorization_200_response"
          description: Authorization approved and code generated
        "400":
          description: Invalid approval parameters
        "401":
          description: User not authenticated
      security:
      - bearerAuth: []
      summary: Approve OAuth Authorization Consent
      tags:
      - OAuth
  /oauth/token:
    post:
      description: Exchanges an authorization code or refresh token for a standard
        RS256 JWT access token (RFC 6749 / RFC 7636).
      operationId: exchangeOAuthToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/exchangeOAuthToken_200_response"
          description: Token issued successfully
        "400":
          description: Invalid grant or request parameters
        "401":
          description: Invalid client credentials
      summary: Exchange OAuth 2.0 Token
      tags:
      - OAuth
  /oauth/authorize/info:
    get:
      description: "Retrieves client metadata, requested scopes, verified user identity,\
        \ and accessible projects to render the OAuth consent interface."
      operationId: getOAuthAuthorizeInfo
      parameters:
      - description: Registered OAuth client identifier
        explode: true
        in: query
        name: client_id
        required: true
        schema:
          example: omni_client_0195a8f2c3e471238000000000000001
          type: string
        style: form
      - description: Target redirection URI matching registered client URIs
        explode: true
        in: query
        name: redirect_uri
        required: true
        schema:
          example: https://claude.ai/api/mcp/oauth_callback
          type: string
        style: form
      - description: OAuth response type (must be "code")
        explode: true
        in: query
        name: response_type
        required: true
        schema:
          default: code
          example: code
          type: string
        style: form
      - description: Space-delimited requested scopes
        explode: true
        in: query
        name: scope
        required: false
        schema:
          example: omnismith:all
          type: string
        style: form
      - description: PKCE code challenge string (RFC 7636)
        explode: true
        in: query
        name: code_challenge
        required: false
        schema:
          example: E9Melhoa2OwvFrGMTJguCH5SZXgk6uKUaz312M20O48
          type: string
        style: form
      - description: PKCE code challenge transformation method
        explode: true
        in: query
        name: code_challenge_method
        required: false
        schema:
          default: S256
          enum:
          - S256
          - plain
          example: S256
          type: string
        style: form
      - description: Opaque client state parameter for CSRF mitigation
        explode: true
        in: query
        name: state
        required: false
        schema:
          example: state_xyz123
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getOAuthAuthorizeInfo_200_response"
          description: Authorization consent info and accessible projects
        "400":
          description: Invalid authorization request parameters
        "401":
          description: User not authenticated
      security:
      - bearerAuth: []
      summary: Get OAuth Authorization Consent Screen Info
      tags:
      - OAuth
  /.well-known/jwks.json:
    get:
      description: Returns the JSON Web Key Set (RFC 7517) containing the active public
        cryptographic keys used to verify RS256 JWT access tokens issued by the platform.
      operationId: getJwks
      responses:
        "200":
          content:
            application/json:
              schema:
