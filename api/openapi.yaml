      - redirect_uris
      type: object
    RevokeOAuthTokenRequest:
      description: OAuth 2.0 token revocation request (RFC 7009) to invalidate active
        refresh or access tokens.
      example:
        token_type_hint: refresh_token
        client_id: omni_client_0195a8f2c3e471238000000000000001
        token: omni_ort_0195a8f2c3e471238000000000000004
      properties:
        token:
          description: The token string that the client wants to revoke
          example: omni_ort_0195a8f2c3e471238000000000000004
          type: string
        token_type_hint:
          description: Hint about the type of token submitted for revocation
          enum:
